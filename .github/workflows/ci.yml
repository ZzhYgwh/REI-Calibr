name: CI

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Check syntax and configuration
        run: |
          python -m py_compile calibr_tools/velocity/*.py scripts/*.py
          python - <<'PY'
          import yaml
          for path in ("configs/radar_only.yaml", "configs/full_pipeline.yaml"):
              with open(path, encoding="utf-8") as handle:
                  yaml.safe_load(handle)
          PY
      - name: Run synthetic radar smoke test
        env:
          MPLBACKEND: Agg
        run: |
          python scripts/make_synthetic_example.py --output /tmp/rei-calibr-example
          python -m calibr_tools.velocity.pipeline \
            --config configs/radar_only.yaml \
            --data-dir /tmp/rei-calibr-example \
            --output /tmp/rei-calibr-output
          test -f /tmp/rei-calibr-output/radar_main/radar_result.json
