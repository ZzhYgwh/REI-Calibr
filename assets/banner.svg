  <text x="500" y="214" fill="#F4F8FF" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="96" font-weight="700">REI-CALIBR</text>
  <rect x="504" y="244" width="910" height="4" rx="2" fill="url(#rule)"/>
