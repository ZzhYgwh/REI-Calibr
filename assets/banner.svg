<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
  <title id="title">REI-Calibr banner</title>
  <desc id="desc">REI-Calibr, velocity-domain motion calibration for radar, event camera, and IMU.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121F35"/>
      <stop offset="0.55" stop-color="#0A1220"/>
      <stop offset="1" stop-color="#070C15"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF714B" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#FF714B"/>
      <stop offset="0.65" stop-color="#C56BFF"/>
      <stop offset="1" stop-color="#39E3C4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="480" rx="36" fill="url(#bg)"/>
  <rect x="1" y="1" width="1598" height="478" rx="35" fill="none" stroke="#C6D8F4" stroke-opacity="0.12" stroke-width="2"/>

  <g transform="translate(86 70) scale(0.66)">
