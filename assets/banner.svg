  <text x="504" y="374" fill="#8EA6C5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="400">Velocity-domain motion calibration</text>

  <text x="1210" y="286" fill="#8EA6C5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600">VELOCITY DOMAIN</text>
