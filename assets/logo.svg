<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">REI-Calibr logo</title>
  <desc id="desc">A velocity vector passes through a calibration crosshair, trailed by three colored sensor-motion lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101B2E"/>
      <stop offset="1" stop-color="#070D18"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="14" y="14" width="484" height="484" rx="92" fill="none" stroke="#A9BCDA" stroke-opacity="0.12" stroke-width="2"/>

  <g filter="url(#shadow)" fill="none" stroke-linecap="round">
    <path d="M 118 329 A 166 166 0 0 1 151 198" stroke="#FF714B" stroke-width="18"/>
    <path d="M 187 140 A 166 166 0 0 1 331 117" stroke="#C56BFF" stroke-width="18"/>
    <path d="M 370 151 A 166 166 0 0 1 395 294" stroke="#39E3C4" stroke-width="18"/>
    <path d="M 365 357 A 166 166 0 0 1 250 398" stroke="#FF714B" stroke-width="18" opacity="0.65"/>
  </g>

  <circle cx="256" cy="256" r="118" fill="#0B1424" stroke="#D8E6FF" stroke-opacity="0.16" stroke-width="2"/>
  <circle cx="256" cy="256" r="76" fill="none" stroke="#D8E6FF" stroke-opacity="0.10" stroke-width="2"/>

  <g fill="none" stroke-linecap="round">
    <path d="M 149 377 L 250 276" stroke="#FF714B" stroke-width="10" opacity="0.92"/>
    <path d="M 168 393 L 269 292" stroke="#C56BFF" stroke-width="10" opacity="0.92"/>
    <path d="M 187 409 L 288 308" stroke="#39E3C4" stroke-width="10" opacity="0.92"/>
  </g>

  <path d="M 201 323 L 337 187" stroke="#F4F8FF" stroke-width="25" stroke-linecap="round"/>
  <path d="M 369 149 L 319 164 L 351 196 Z" fill="#F4F8FF"/>

  <circle cx="201" cy="323" r="37" fill="#0B1424" stroke="#F4F8FF" stroke-width="7"/>
  <g stroke="#F4F8FF" stroke-width="7" stroke-linecap="round">
    <path d="M 201 272 L 201 298"/>
    <path d="M 201 348 L 201 374"/>
    <path d="M 150 323 L 176 323"/>
    <path d="M 226 323 L 252 323"/>
  </g>
  <circle cx="201" cy="323" r="10" fill="#F4F8FF"/>
  <circle cx="201" cy="323" r="4" fill="#0B1424"/>

</svg>
