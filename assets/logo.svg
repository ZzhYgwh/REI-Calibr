<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">REI-Calibr logo</title>
  <desc id="desc">Three colored sensor arcs around a calibration crosshair.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101B2E"/>
      <stop offset="1" stop-color="#070D18"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="14" y="14" width="484" height="484" rx="92" fill="none" stroke="#A9BCDA" stroke-opacity="0.12" stroke-width="2"/>

  <g filter="url(#shadow)" fill="none" stroke-linecap="round">
    <path d="M 118 329 A 166 166 0 0 1 151 198" stroke="#FF714B" stroke-width="20"/>
    <path d="M 187 140 A 166 166 0 0 1 331 117" stroke="#C56BFF" stroke-width="20"/>
    <path d="M 370 151 A 166 166 0 0 1 395 294" stroke="#39E3C4" stroke-width="20"/>
    <path d="M 365 357 A 166 166 0 0 1 250 398" stroke="#FF714B" stroke-width="20" opacity="0.72"/>
  </g>

  <circle cx="256" cy="256" r="118" fill="#0B1424" stroke="#D8E6FF" stroke-opacity="0.16" stroke-width="2"/>
  <circle cx="256" cy="256" r="76" fill="none" stroke="#D8E6FF" stroke-opacity="0.10" stroke-width="2"/>

  <g stroke="#F4F8FF" stroke-width="12" stroke-linecap="round">
    <path d="M256 186 L256 238"/>
    <path d="M256 274 L256 326"/>
    <path d="M186 256 L238 256"/>
    <path d="M274 256 L326 256"/>
  </g>
  <circle cx="256" cy="256" r="18" fill="#F4F8FF"/>
  <circle cx="256" cy="256" r="8" fill="#0B1424"/>

</svg>
