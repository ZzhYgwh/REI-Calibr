[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rei-calibr"
version = "0.2.1"
description = "Reference-twist-based velocity-domain spatiotemporal calibration for radar, event camera, and IMU"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "REI-Calibr contributors" },
]
dependencies = [
  "numpy>=1.21",
  "scipy>=1.10",
  "PyYAML>=6.0",
  "matplotlib>=3.1",
]

[project.urls]
Repository = "https://github.com/ZzhYgwh/REI-Calibr"
Paper = "https://arxiv.org/abs/2611.26083"
Video = "https://www.youtube.com/watch?v=mXS583RE3yQ"
Frontend = "https://github.com/ZzhYgwh/REI-Calibr-Frontend"
"Raw recordings" = "https://drive.google.com/drive/folders/11vWLF8X6Cd7w-J2NAtEPvszvG5DYo0Hy?usp=drive_link"
"Calibration inputs" = "https://drive.google.com/drive/folders/1pBN6QWuz3XEVE6UZTKoemDToQXk3U_Nt?usp=drive_link"

[project.scripts]
rei-calibr = "calibr_tools.velocity.pipeline:main"

[tool.setuptools.packages.find]
include = ["calibr_tools*"]
