[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rei-calibr"
version = "0.1.0"
description = "Velocity-domain spatiotemporal calibration for radar, event camera, and IMU"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "REI-Calibr contributors" },
]
dependencies = [
  "numpy>=1.21",
  "scipy>=1.10",
  "PyYAML>=6.0",
  "matplotlib>=3.1",
]

[project.urls]
Repository = "https://github.com/ZzhYgwh/REI-Calibr"

[project.scripts]
rei-calibr = "calibr_tools.velocity.pipeline:main"

[tool.setuptools.packages.find]
include = ["calibr_tools*"]
